    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            },
            colors: {
              velicia: {
                purple: '#7928CA',
                pink: '#FF0080',
                deep: '#4C1D95',
                vivid: '#D946EF'
              }
            },
            animation: {
                'vivid-pulse': 'vivid-pulse 5s ease-in-out infinite',
            },
            keyframes: {
              'vivid-pulse': {
                '0%, 100%': { opacity: '0.6', transform: 'scale(1) translate(-50%, -50%)' },
                '50%': { opacity: '0.9', transform: 'scale(1.15) translate(-50%, -50%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #FAFAFA;
        letter-spacing: -0.015em;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* --- SHARP VIVID TEXT GRADIENT --- */
      .text-vivid-gradient {
        background: linear-gradient(to right, #9333EA 0%, #FF0080 50%, #FF1E1E 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        background-size: 200% auto;
        filter: drop-shadow(0 2px 12px rgba(255, 0, 128, 0.4));
      }

      /* --- PERFECTLY CENTERED & ROUNDED BUTTONS --- */
      .uiverse-button {
        cursor: pointer;
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        background: linear-gradient(135deg, #8B5CF6 0%, #FF0080 100%);
        border-radius: 9999px;
        border: none;
        outline: none;
        padding: 16px 40px;
        min-width: 260px;
        box-shadow: 0 10px 40px -10px rgba(255, 0, 128, 0.8);
      }
      .uiverse-button:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 20px 50px -10px rgba(255, 0, 128, 0.9);
      }
      .uiverse-button:active { transform: scale(0.97); }

      .btn-github {
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        border: 2px solid rgba(255, 255, 255, 0.05);
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        border-radius: 9999px;
        font-weight: 800;
        padding: 16px 40px;
        font-size: 1rem;
        background-color: #111;
        color: #fff;
        text-decoration: none;
        min-width: 220px;
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
      }

      .btn-github:hover {
        background-color: #000;
        color: #FF0080;
        border-color: #FF0080;
        transform: translateY(-4px);
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.4);
      }

      /* --- GLOW EFFECTS --- */
      .hero-glow {
        position: absolute;
        width: 100%;
        max-width: 900px;
        height: 600px;
        /* Reverted to a softer, comfortable gradient (Pink core, fading to purple/transparent) */
        background: radial-gradient(circle at 50% 30%, rgba(255, 0, 128, 0.5) 0%, rgba(121, 40, 202, 0.3) 45%, transparent 75%);
        filter: blur(60px); /* Increased blur for softness */
        top: -140px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 0;
        pointer-events: none;
      }
      
      .btn-shine {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 12px 48px;
        color: #fff;
        background: linear-gradient(to right, #9f9f9f 0, #fff 10%, #868686 20%);
        background-position: 0;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 3s infinite linear;
        font-weight: 800;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        pointer-events: none;
      }
      @keyframes shine {
        0% { background-position: -200px; }
        60% { background-position: 200px; }
        100% { background-position: 200px; }
      }

      .fold {
        z-index: 1;
        position: absolute;
        top: 0;
        right: 0;
        height: 1.2rem;
        width: 1.2rem;
        display: inline-block;
        transition: all 0.5s ease-in-out;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(5px);
        border-bottom-left-radius: 0.5rem;
      }
      .fold::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 150%;
        height: 150%;
        transform: rotate(45deg) translateX(0%) translateY(-18px);
        background-color: #fff;
        pointer-events: none;
      }
    </style>
