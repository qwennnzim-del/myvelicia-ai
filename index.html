    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #FAFAFA;
        letter-spacing: -0.015em;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* --- SHARP VIVID TEXT GRADIENT --- */
      .text-vivid-gradient {
        background: linear-gradient(to right, #9333EA 0%, #FF0080 50%, #FF1E1E 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        background-size: 200% auto;
        filter: drop-shadow(0 2px 12px rgba(255, 0, 128, 0.4));
      }

      /* --- PERFECTLY CENTERED & ROUNDED BUTTONS --- */
      .uiverse-button {
        cursor: pointer;
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        background: linear-gradient(135deg, #8B5CF6 0%, #FF0080 100%);
        border-radius: 9999px;
        border: none;
        outline: none;
        padding: 16px 40px;
        min-width: 260px;
        box-shadow: 0 10px 40px -10px rgba(255, 0, 128, 0.8);
      }
      .uiverse-button:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 20px 50px -10px rgba(255, 0, 128, 0.9);
      }
      .uiverse-button:active { transform: scale(0.97); }

      .btn-github {
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        border: 2px solid rgba(255, 255, 255, 0.05);
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        border-radius: 9999px;
        font-weight: 800;
        padding: 16px 40px;
        font-size: 1rem;
        background-color: #111;
        color: #fff;
        text-decoration: none;
        min-width: 220px;
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
      }

      .btn-github:hover {
        background-color: #000;
        color: #FF0080;
        border-color: #FF0080;
        transform: translateY(-4px);
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.4);
      }

      /* --- GLOW EFFECTS --- */
      .hero-glow {
        position: absolute;
        width: 100%;
        max-width: 900px;
        height: 600px;
        background: radial-gradient(circle at 50% 30%, rgba(255, 0, 128, 0.5) 0%, rgba(121, 40, 202, 0.3) 45%, transparent 75%);
        filter: blur(60px);
        top: -140px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 0;
        pointer-events: none;
      }
      
      .btn-shine {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 12px 48px;
        color: #fff;
        background: linear-gradient(to right, #9f9f9f 0, #fff 10%, #868686 20%);
        background-position: 0;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 3s infinite linear;
        font-weight: 800;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        pointer-events: none;
      }
      @keyframes shine {
        0% { background-position: -200px; }
        60% { background-position: 200px; }
        100% { background-position: 200px; }
      }

      .fold {
        z-index: 1;
        position: absolute;
        top: 0;
        right: 0;
        height: 1.2rem;
        width: 1.2rem;
        display: inline-block;
        transition: all 0.5s ease-in-out;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(5px);
        border-bottom-left-radius: 0.5rem;
      }
      .fold::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 150%;
        height: 150%;
        transform: rotate(45deg) translateX(0%) translateY(-18px);
        background-color: #fff;
        pointer-events: none;
      }

      /* --- NEW AI LOADER (Optimized) --- */
      .loader {
        /* Brand Colors: Purple & Pink */
        --color-one: #7928CA;
        --color-two: #FF0080;
        --color-three: rgba(121, 40, 202, 0.5);
        --color-four: rgba(255, 0, 128, 0.5);
        --color-five: rgba(121, 40, 202, 0.2);
        --time-animation: 2s;
        
        position: relative;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        box-shadow:
          0 0 25px 0 var(--color-three),
          0 20px 50px 0 var(--color-four);
        animation: colorize calc(var(--time-animation) * 3) ease-in-out infinite;
      }

      .loader::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border-top: solid 1px var(--color-one);
        border-bottom: solid 1px var(--color-two);
        background: linear-gradient(180deg, var(--color-five), var(--color-four));
        box-shadow:
          inset 0 10px 10px 0 var(--color-three),
          inset 0 -10px 10px 0 var(--color-four);
      }

      .loader .box {
        width: 100px;
        height: 100px;
        background: linear-gradient(
          180deg,
          var(--color-one) 30%,
          var(--color-two) 70%
        );
        mask: url(#clipping);
        -webkit-mask: url(#clipping);
      }

      .loader svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .loader svg #clipping {
        filter: contrast(15);
        animation: roundness calc(var(--time-animation) / 2) linear infinite;
      }

      .loader svg #clipping polygon {
        filter: blur(7px);
      }

      .loader svg #clipping polygon:nth-child(1) {
        transform-origin: 75% 25%;
        transform: rotate(90deg);
      }

      .loader svg #clipping polygon:nth-child(2) {
        transform-origin: 50% 50%;
        animation: rotation var(--time-animation) linear infinite reverse;
      }

      .loader svg #clipping polygon:nth-child(3) {
        transform-origin: 50% 60%;
        animation: rotation var(--time-animation) linear infinite;
        animation-delay: calc(var(--time-animation) / -3);
      }

      .loader svg #clipping polygon:nth-child(4) {
        transform-origin: 40% 40%;
        animation: rotation var(--time-animation) linear infinite reverse;
      }

      .loader svg #clipping polygon:nth-child(5) {
        transform-origin: 40% 40%;
        animation: rotation var(--time-animation) linear infinite reverse;
        animation-delay: calc(var(--time-animation) / -2);
      }

      .loader svg #clipping polygon:nth-child(6) {
        transform-origin: 60% 40%;
        animation: rotation var(--time-animation) linear infinite;
      }

      .loader svg #clipping polygon:nth-child(7) {
        transform-origin: 60% 40%;
        animation: rotation var(--time-animation) linear infinite;
        animation-delay: calc(var(--time-animation) / -1.5);
      }

      @keyframes rotation {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes roundness {
        0% { filter: contrast(15); }
        20% { filter: contrast(3); }
        40% { filter: contrast(3); }
        60% { filter: contrast(15); }
        100% { filter: contrast(15); }
      }

      @keyframes colorize {
        0% { filter: hue-rotate(0deg); }
        20% { filter: hue-rotate(-30deg); }
        40% { filter: hue-rotate(-60deg); }
        60% { filter: hue-rotate(-90deg); }
        80% { filter: hue-rotate(-45deg); }
        100% { filter: hue-rotate(0deg); }
      }
    </style>
